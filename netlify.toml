[build]
  environment = { NODE_VERSION = "22" }

[functions]
  directory = "functions/"

# Bare site URL works as a proxy URL too (see functions/root.js).
[[redirects]]
  from = "/"
  to = "/.netlify/functions/root"
  status = 200
  force = true

# "/api" and "/api/" go to the proxy instead of a non-existent function.
[[redirects]]
  from = "/api"
  to = "/.netlify/functions/index"
  status = 200
  force = true

[[redirects]]
  from = "/api/"
  to = "/.netlify/functions/index"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, OPTIONS"
    Access-Control-Allow-Headers = "*"
